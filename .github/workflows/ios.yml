name: Build iPhone app
on:
  workflow_dispatch:
  push:
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild -project MangoVille.xcodeproj -scheme MangoVille -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/MangoVille.app Payload/
          zip -qr MangoVille.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: MangoVille-ipa, path: MangoVille.ipa }
